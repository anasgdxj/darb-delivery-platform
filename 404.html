<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/darb-delivery-platform/">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#14171D">
  <title>الصفحة غير موجودة | DAZREVO</title>
  <meta name="description" content="تعذر العثور على الصفحة المطلوبة في موقع DAZREVO.">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #F5F3EE;
      background:
        radial-gradient(circle at 12% 12%, rgba(214,180,108,.17), transparent 34%),
        radial-gradient(circle at 88% 88%, rgba(63,209,190,.12), transparent 34%),
        #0C0D0F;
      font-family: Cairo, Tahoma, sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: clamp(26px, 6vw, 48px);
      text-align: center;
      border: 1px solid rgba(214,180,108,.28);
      border-radius: 28px;
      background: rgba(20,23,29,.94);
      box-shadow: 0 28px 80px rgba(0,0,0,.32);
    }
    .mark {
      width: 66px;
      height: 66px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(214,180,108,.36);
      border-radius: 20px;
      color: #D6B46C;
      font-size: 26px;
      font-weight: 900;
    }
    .brand { color: #D6B46C; font-size: 12px; font-weight: 900; letter-spacing: .14em; }
    h1 { margin: 12px 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.25; }
    p { margin: 0 auto 24px; color: #C8C4BA; line-height: 1.9; }
    .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    a { min-height: 46px; padding: 10px 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 13px; font-weight: 900; text-decoration: none; }
    .primary { background: #D6B46C; color: #14171D; }
    .secondary { border: 1px solid rgba(255,255,255,.16); color: #F5F3EE; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">D</div>
    <div class="brand">DAZREVO · SMART DELIVERY</div>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>قد يكون الرابط غير صحيح أو تم نقل الصفحة. يمكنك العودة إلى موقع دازريفو أو تنزيل تطبيق أندرويد الرسمي.</p>
    <div class="actions">
      <a class="primary" href="./">العودة إلى DAZREVO</a>
      <a class="secondary" href="./#download">تنزيل التطبيق</a>
    </div>
  </main>
</body>
</html>
