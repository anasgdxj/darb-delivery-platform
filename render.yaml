# Render Blueprint for DARB API — zero-cost preview deployment.
# Database and Redis remain external free-tier services.
services:
  - type: web
    name: darb-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/healthz
    buildCommand: >-
      mkdir -p .render-build &&
      unzip -q DARB-source.zip -d .render-build &&
      cp -R backend/src/. .render-build/darb-project/backend/src/ &&
      cp backend-overrides/main.ts .render-build/darb-project/backend/src/main.ts &&
      cp backend-overrides/sms.providers.ts .render-build/darb-project/backend/src/modules/auth/sms/sms.providers.ts &&
      cp backend-overrides/auth.service.ts .render-build/darb-project/backend/src/modules/auth/auth.service.ts &&
      cp backend-overrides/auth.controller.ts .render-build/darb-project/backend/src/modules/auth/auth.controller.ts &&
      cp backend-overrides/otp.service.ts .render-build/darb-project/backend/src/modules/auth/otp.service.ts &&
      cp backend-overrides/admin.controller.ts .render-build/darb-project/backend/src/modules/admin/admin.controller.ts &&
      cp backend-overrides/vendors.service.ts .render-build/darb-project/backend/src/modules/vendors/vendors.service.ts &&
      cp backend-overrides/vendor-application.dto.ts .render-build/darb-project/backend/src/modules/vendors/vendor-application.dto.ts &&
      cp backend-overrides/addresses.service.ts .render-build/darb-project/backend/src/modules/addresses/addresses.service.ts &&
      cp backend-overrides/addresses.controller.ts .render-build/darb-project/backend/src/modules/addresses/addresses.controller.ts &&
      cp backend-overrides/drivers.service.ts .render-build/darb-project/backend/src/modules/drivers/drivers.service.ts &&
      cp backend-overrides/drivers.module.ts .render-build/darb-project/backend/src/modules/drivers/drivers.module.ts &&
      cp backend-overrides/driver-location.controller.ts .render-build/darb-project/backend/src/modules/drivers/driver-location.controller.ts &&
      cp backend-overrides/driver-location.service.ts .render-build/darb-project/backend/src/modules/drivers/driver-location.service.ts &&
      cp backend-overrides/orders.module.ts .render-build/darb-project/backend/src/modules/orders/orders.module.ts &&
      cp backend-overrides/orders.tracking.controller.ts .render-build/darb-project/backend/src/modules/orders/orders.tracking.controller.ts &&
      cp backend-overrides/orders.tracking.service.ts .render-build/darb-project/backend/src/modules/orders/orders.tracking.service.ts &&
      cp backend-overrides/orders.controller.ts .render-build/darb-project/backend/src/modules/orders/orders.controller.ts &&
      cp backend-overrides/orders.service.ts .render-build/darb-project/backend/src/modules/orders/orders.service.ts &&
      mkdir -p .render-build/darb-project/backend/src/modules/ai-order-assistant &&
      cp backend-overrides/ai-order-assistant.module.ts .render-build/darb-project/backend/src/modules/ai-order-assistant/ai-order-assistant.module.ts &&
      cp backend-overrides/ai-order-assistant.controller.ts .render-build/darb-project/backend/src/modules/ai-order-assistant/ai-order-assistant.controller.ts &&
      cp backend-overrides/ai-order-assistant.service.ts .render-build/darb-project/backend/src/modules/ai-order-assistant/ai-order-assistant.service.ts &&
      mkdir -p .render-build/darb-project/backend/src/modules/ai-role-assistant &&
      cp backend-overrides/ai-role-assistant.module.ts .render-build/darb-project/backend/src/modules/ai-role-assistant/ai-role-assistant.module.ts &&
      cp backend-overrides/ai-role-assistant.controller.ts .render-build/darb-project/backend/src/modules/ai-role-assistant/ai-role-assistant.controller.ts &&
      cp backend-overrides/ai-role-assistant.service.ts .render-build/darb-project/backend/src/modules/ai-role-assistant/ai-role-assistant.service.ts &&
      cp backend-overrides/ai-text-provider.ts .render-build/darb-project/backend/src/modules/ai-role-assistant/ai-text-provider.ts &&
      cp backend-overrides/gemini-ai-text-provider.ts .render-build/darb-project/backend/src/modules/ai-role-assistant/gemini-ai-text-provider.ts &&
      mkdir -p .render-build/darb-project/backend/src/modules/notifications .render-build/darb-project/backend/src/modules/health &&
      cp -R backend/src/modules/health/. .render-build/darb-project/backend/src/modules/health/ &&
      cp backend-overrides/notifications.service.ts .render-build/darb-project/backend/src/modules/notifications/notifications.service.ts &&
      cp backend-overrides/notifications.controller.ts .render-build/darb-project/backend/src/modules/notifications/notifications.controller.ts &&
      cp backend-overrides/notifications.module.ts .render-build/darb-project/backend/src/modules/notifications/notifications.module.ts &&
      mkdir -p .render-build/darb-project/backend/src/modules/telegram-admin &&
      cp backend-overrides/telegram-admin.module.ts .render-build/darb-project/backend/src/modules/telegram-admin/telegram-admin.module.ts &&
      cp backend-overrides/telegram-admin.controller.ts .render-build/darb-project/backend/src/modules/telegram-admin/telegram-admin.controller.ts &&
      cp backend-overrides/telegram-admin.service.ts .render-build/darb-project/backend/src/modules/telegram-admin/telegram-admin.service.ts &&
      cp backend-overrides/release-notifications.controller.ts .render-build/darb-project/backend/src/modules/notifications/release-notifications.controller.ts &&
      cp backend-overrides/app.module.ts .render-build/darb-project/backend/src/app.module.ts &&
      mkdir -p .render-build/darb-project/backend/prisma/migrations/20261117170000_firebase_devices &&
      cp backend-overrides/firebase-devices.migration.sql .render-build/darb-project/backend/prisma/migrations/20261117170000_firebase_devices/migration.sql &&
      mkdir -p .render-build/darb-project/backend/prisma/migrations/20261117180000_seed_syrian_cities &&
      cp backend-overrides/syrian-cities.migration.sql .render-build/darb-project/backend/prisma/migrations/20261117180000_seed_syrian_cities/migration.sql &&
      mkdir -p .render-build/darb-project/backend/prisma/migrations/20261117190000_unique_delivery_zone_per_city &&
      cp backend-overrides/unique-delivery-zone-per-city.migration.sql .render-build/darb-project/backend/prisma/migrations/20261117190000_unique_delivery_zone_per_city/migration.sql &&
      mkdir -p .render-build/darb-project/backend/prisma/migrations/20261118195000_peer_delivery_pickup_coordinates &&
      cp backend-overrides/pickup-coordinates.migration.sql .render-build/darb-project/backend/prisma/migrations/20261118195000_peer_delivery_pickup_coordinates/migration.sql &&
      cp backend-overrides/schema.prisma .render-build/darb-project/backend/prisma/schema.prisma &&
      mkdir -p .render-build/darb-project/backend/prisma/migrations/20261117160000_google_accounts &&
      cp backend-overrides/google-accounts.migration.sql .render-build/darb-project/backend/prisma/migrations/20261117160000_google_accounts/migration.sql &&
      mkdir -p .render-build/darb-project/backend/prisma/migrations &&
      cp -R backend/prisma/migrations/. .render-build/darb-project/backend/prisma/migrations/ &&
      bash backend-overrides/prepare-source.sh .render-build/darb-project &&
      cd .render-build/darb-project/backend &&
      npm install --include=dev --no-audit --no-fund &&
      npx prisma generate &&
      npm run build
    startCommand: cd .render-build/darb-project/backend && npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: msgplus
      - key: MSGPLUS_API_KEY
        sync: false
      - key: MSGPLUS_SENDER_ID
        sync: false
      - key: MSGPLUS_TEMPLATE_ID
        value: "1"
      - key: GOOGLE_SERVER_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_ORDER_MODEL
        value: gpt-4o-mini

