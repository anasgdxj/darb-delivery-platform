name: DARB Design System Contract

on:
  push:
    branches: [main]
    paths:
      - 'DESIGN_SYSTEM.md'
      - 'mobile-overrides/lib/core/theme/darb_design_system.dart'
      - 'admin-web/index.html'
      - 'scripts/verify-design-system.py'
      - '.github/workflows/design-system-contract.yml'
  pull_request:
    paths:
      - 'DESIGN_SYSTEM.md'
      - 'mobile-overrides/lib/core/theme/darb_design_system.dart'
      - 'scripts/verify-design-system.py'
      - '.github/workflows/design-system-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-contract:
    name: Semantic color and contrast validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify design-system contract
        run: python scripts/verify-design-system.py
