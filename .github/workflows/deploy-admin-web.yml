name: Validate DAZREVO admin portal

on:
  pull_request:
    paths:
      - "admin-web/**"
      - ".github/workflows/deploy-admin-web.yml"
  push:
    branches: [main]
    paths:
      - "admin-web/**"
      - ".github/workflows/deploy-admin-web.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate admin portal without deploying a partial Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate admin portal JavaScript and required operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("admin-web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline admin script, found {len(scripts)}")
          Path("/tmp/admin.js").write_text(scripts[0], encoding="utf-8")
          required = ["/admin/delivery-zones", "renderZones", "/admin/drivers/pending", "/admin/vendors/pending", "handleGoogleCredential"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing admin portal requirements: " + ", ".join(missing))
          PY
          node --check /tmp/admin.js
