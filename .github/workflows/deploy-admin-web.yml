name: Deploy DAZREVO public website and admin portal
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/index.html"
      - "admin-web/**"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - "site.webmanifest"
      - "google3dcfcc43ffdf1742.html"
      - ".github/workflows/deploy-admin-web.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build signed DAZREVO Android release"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || contains(github.event.workflow_run.head_commit.message, '[publish-apk]')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate admin portal JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("admin-web/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline admin script, found {len(scripts)}")
          Path("/tmp/admin.js").write_text(scripts[0])
          required = ["/admin/delivery-zones", "renderZones", "/admin/drivers/pending", "/admin/vendors/pending", "handleGoogleCredential"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing admin portal requirements: " + ", ".join(missing))
          PY
          node --check /tmp/admin.js
      - name: Assemble public website and admin portal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pages/admin
          test -s index.html
          test -s admin-web/index.html
          cp index.html .pages/index.html
          cp admin-web/index.html .pages/admin/index.html
          cp -R assets .pages/assets
          rm -rf .pages/assets/cities
          cp robots.txt sitemap.xml site.webmanifest .pages/
          cp google3dcfcc43ffdf1742.html .pages/google3dcfcc43ffdf1742.html
          test -s .pages/google3dcfcc43ffdf1742.html
          test ! -d .pages/assets/cities
          for section in en tr faq drivers merchants privacy terms; do
            test -s "$section/index.html"
            mkdir -p ".pages/$section"
            cp "$section/index.html" ".pages/$section/index.html"
          done
          cat > .pages/404.html <<'EOF'
          <!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14171D"><title>الصفحة غير موجودة | DAZREVO</title><body style="font-family:Cairo,Tahoma,Arial;background:#FAF9F6;color:#141413;display:grid;place-items:center;min-height:90vh;text-align:center;padding:24px"><main><h1>هذه الصفحة غير موجودة</h1><p style="color:#636059">قد يكون الرابط غير صحيح أو تم نقل الصفحة.</p><a href="./" style="display:inline-block;margin-top:16px;padding:11px 20px;border-radius:12px;background:#D6B46C;color:#14171D;font-weight:800">العودة إلى موقع دازريفو</a></main></body></html>
          EOF
      - name: Attach latest Android release metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors https://github.com/anasgdxj/darb-delivery-platform/releases/download/latest/app-update.json --output .pages/app-update.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.pages/app-update.json').read_text(encoding='utf-8'))
          if not isinstance(data.get('versionCode'), int) or not data.get('versionName'):
              raise SystemExit('Latest Android release metadata is invalid.')
          if data.get('apkUrl') != 'https://github.com/anasgdxj/darb-delivery-platform/releases/download/latest/app-release.apk':
              raise SystemExit('Latest APK URL is not the official DAZREVO release asset.')
          print(f"Website release metadata verified: {data['versionName']} ({data['versionCode']}).")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .pages
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
