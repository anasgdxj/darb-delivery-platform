name: Validate DAZREVO source archive

on:
  push:
    paths:
      - "DARB-source.zip"
      - "backend/**"
      - "backend-overrides/**"
      - ".github/workflows/validate-source.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source and apply the same backend overlays used by deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s DARB-source.zip
          unzip -q DARB-source.zip -d extracted
          ROOT="$GITHUB_WORKSPACE"
          B="$ROOT/extracted/darb-project/backend"
          cp -R "$ROOT/backend/src/." "$B/src/"
          mkdir -p "$B/src/modules/auth/sms"
          cp "$ROOT/backend-overrides/sms.providers.ts" "$B/src/modules/auth/sms/sms.providers.ts"
          cp "$ROOT/backend-overrides/auth.service.ts" "$B/src/modules/auth/auth.service.ts"
          cp "$ROOT/backend-overrides/auth.controller.ts" "$B/src/modules/auth/auth.controller.ts"
          cp "$ROOT/backend-overrides/otp.service.ts" "$B/src/modules/auth/otp.service.ts"
          cp "$ROOT/backend-overrides/admin.controller.ts" "$B/src/modules/admin/admin.controller.ts"
          cp "$ROOT/backend-overrides/vendors.service.ts" "$B/src/modules/vendors/vendors.service.ts"
          cp "$ROOT/backend-overrides/vendor-application.dto.ts" "$B/src/modules/vendors/vendor-application.dto.ts"
          cp "$ROOT/backend-overrides/addresses.service.ts" "$B/src/modules/addresses/addresses.service.ts"
          cp "$ROOT/backend-overrides/addresses.controller.ts" "$B/src/modules/addresses/addresses.controller.ts"
          cp "$ROOT/backend-overrides/drivers.service.ts" "$B/src/modules/drivers/drivers.service.ts"
          cp "$ROOT/backend-overrides/drivers.module.ts" "$B/src/modules/drivers/drivers.module.ts"
          cp "$ROOT/backend-overrides/driver-location.controller.ts" "$B/src/modules/drivers/driver-location.controller.ts"
          cp "$ROOT/backend-overrides/driver-location.service.ts" "$B/src/modules/drivers/driver-location.service.ts"
          cp "$ROOT/backend-overrides/orders.module.ts" "$B/src/modules/orders/orders.module.ts"
          cp "$ROOT/backend-overrides/orders.controller.ts" "$B/src/modules/orders/orders.controller.ts"
          cp "$ROOT/backend-overrides/orders.service.ts" "$B/src/modules/orders/orders.service.ts"
          cp "$ROOT/backend-overrides/orders.tracking.controller.ts" "$B/src/modules/orders/orders.tracking.controller.ts"
          cp "$ROOT/backend-overrides/orders.tracking.service.ts" "$B/src/modules/orders/orders.tracking.service.ts"
          mkdir -p "$B/src/modules/ai-order-assistant" "$B/src/modules/ai-role-assistant"
          cp "$ROOT/backend-overrides/ai-order-assistant.module.ts" "$B/src/modules/ai-order-assistant/ai-order-assistant.module.ts"
          cp "$ROOT/backend-overrides/ai-order-assistant.controller.ts" "$B/src/modules/ai-order-assistant/ai-order-assistant.controller.ts"
          cp "$ROOT/backend-overrides/ai-order-assistant.service.ts" "$B/src/modules/ai-order-assistant/ai-order-assistant.service.ts"
          cp "$ROOT/backend-overrides/ai-role-assistant.module.ts" "$B/src/modules/ai-role-assistant/ai-role-assistant.module.ts"
          cp "$ROOT/backend-overrides/ai-role-assistant.controller.ts" "$B/src/modules/ai-role-assistant/ai-role-assistant.controller.ts"
          cp "$ROOT/backend-overrides/ai-role-assistant.service.ts" "$B/src/modules/ai-role-assistant/ai-role-assistant.service.ts"
          cp "$ROOT/backend-overrides/ai-text-provider.ts" "$B/src/modules/ai-role-assistant/ai-text-provider.ts"
          cp "$ROOT/backend-overrides/gemini-ai-text-provider.ts" "$B/src/modules/ai-role-assistant/gemini-ai-text-provider.ts"
          mkdir -p "$B/src/modules/notifications" "$B/src/modules/health" "$B/src/modules/telegram-admin"
          cp -R "$ROOT/backend/src/modules/health/." "$B/src/modules/health/"
          cp "$ROOT/backend-overrides/notifications.service.ts" "$B/src/modules/notifications/notifications.service.ts"
          cp "$ROOT/backend-overrides/notifications.controller.ts" "$B/src/modules/notifications/notifications.controller.ts"
          cp "$ROOT/backend-overrides/notifications.module.ts" "$B/src/modules/notifications/notifications.module.ts"
          cp "$ROOT/backend-overrides/release-notifications.controller.ts" "$B/src/modules/notifications/release-notifications.controller.ts"
          cp "$ROOT/backend-overrides/telegram-admin.module.ts" "$B/src/modules/telegram-admin/telegram-admin.module.ts"
          cp "$ROOT/backend-overrides/telegram-admin.controller.ts" "$B/src/modules/telegram-admin/telegram-admin.controller.ts"
          cp "$ROOT/backend-overrides/telegram-admin.service.ts" "$B/src/modules/telegram-admin/telegram-admin.service.ts"
          cp "$ROOT/backend-overrides/app.module.ts" "$B/src/app.module.ts"
          cp "$ROOT/backend-overrides/schema.prisma" "$B/prisma/schema.prisma"
          mkdir -p "$B/prisma/migrations/20261118195000_peer_delivery_pickup_coordinates"
          cp "$ROOT/backend-overrides/pickup-coordinates.migration.sql" "$B/prisma/migrations/20261118195000_peer_delivery_pickup_coordinates/migration.sql"
          mkdir -p "$B/prisma/migrations/20261119120000_delivery_offers"
          cp "$ROOT/backend-overrides/delivery-offers.migration.sql" "$B/prisma/migrations/20261119120000_delivery_offers/migration.sql"
          mkdir -p "$B/prisma/migrations/20261120120000_ai_order_assistant"
          cp "$ROOT/backend-overrides/ai-order-assistant.migration.sql" "$B/prisma/migrations/20261120120000_ai_order_assistant/migration.sql"
          mkdir -p "$B/prisma/migrations/20261117160000_google_accounts"
          cp "$ROOT/backend-overrides/google-accounts.migration.sql" "$B/prisma/migrations/20261117160000_google_accounts/migration.sql"
          mkdir -p "$B/prisma/migrations/20261117170000_firebase_devices"
          cp "$ROOT/backend-overrides/firebase-devices.migration.sql" "$B/prisma/migrations/20261117170000_firebase_devices/migration.sql"
          mkdir -p "$B/prisma/migrations/20261117180000_seed_syrian_cities"
          cp "$ROOT/backend-overrides/syrian-cities.migration.sql" "$B/prisma/migrations/20261117180000_seed_syrian_cities/migration.sql"
          mkdir -p "$B/prisma/migrations/20261117190000_unique_delivery_zone_per_city"
          cp "$ROOT/backend-overrides/unique-delivery-zone-per-city.migration.sql" "$B/prisma/migrations/20261117190000_unique-delivery-zone-per-city/migration.sql"
          bash "$ROOT/backend-overrides/prepare-source.sh" "$ROOT/extracted/darb-project"
          cp -R "$ROOT/backend/prisma/migrations/." "$B/prisma/migrations/"
          echo "Backend overlays assembled from the same source set used by deployment."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Build every Node package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find extracted -name package.json -not -path '*/node_modules/*' -not -path '*/.dart_tool/*' | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No package.json found in source archive"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Node package: $dir"
            cd "$GITHUB_WORKSPACE/$dir"
            npm install --no-audit --no-fund
            if [ -f prisma/schema.prisma ]; then npx prisma generate; fi
            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
              npm test -- --runInBand
            fi
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            else
              echo "No build script; checking package metadata only."
            fi
            echo "::endgroup::"
          done
