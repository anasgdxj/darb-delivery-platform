name: Validate DARB source archive

on:
  push:
    paths:
      - "DARB-source.zip"
      - ".github/workflows/validate-source.yml"
      - ".github/workflows/build-android-release.yml"
      - "mobile-overrides/**"
      - "backend-overrides/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s DARB-source.zip
          unzip -q DARB-source.zip -d extracted
          rm -rf extracted/darb-project/mobile/lib/screens extracted/darb-project/mobile/lib/core extracted/darb-project/mobile/lib/features
          mkdir -p extracted/darb-project/mobile/lib extracted/darb-project/mobile/test
          cp -r mobile-overrides/lib/. extracted/darb-project/mobile/lib/
          cp mobile-overrides/test/widget_test.dart extracted/darb-project/mobile/test/widget_test.dart
          bash mobile-overrides/prepare_city_assets.sh extracted/darb-project/mobile
          mkdir -p extracted/darb-project/backend
          cp darb-workspace/darb-project/backend/package.json extracted/darb-project/backend/package.json
          cp darb-workspace/darb-project/backend/package-lock.json extracted/darb-project/backend/package-lock.json
          cp darb-workspace/darb-project/backend/nest-cli.json extracted/darb-project/backend/nest-cli.json
          cp darb-workspace/darb-project/backend/tsconfig.json extracted/darb-project/backend/tsconfig.json
          cp -R backend/src/. extracted/darb-project/backend/src/
          cp backend-overrides/schema.prisma extracted/darb-project/backend/prisma/schema.prisma
          mkdir -p extracted/darb-project/backend/prisma/migrations
          cp -R backend/prisma/migrations/. extracted/darb-project/backend/prisma/migrations/
          bash backend-overrides/prepare-source.sh extracted/darb-project
          echo "Applied modular backend and mobile sources."
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -250

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Build every Node package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find extracted -name package.json -not -path '*/node_modules/*' -not -path '*/.dart_tool/*' | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No package.json found in source archive"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Node package: $dir"
            cd "$GITHUB_WORKSPACE/$dir"
            npm install --no-audit --no-fund
            if [ -f prisma/schema.prisma ]; then npx prisma generate; fi
            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
              npm test -- --runInBand
            fi
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            else
              echo "No build script; checking package metadata only."
            fi
            echo "::endgroup::"
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare stable Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: darb-android-debug-keystore-v1

      - name: Repair Android scaffold, analyze, and build Flutter app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find extracted -name pubspec.yaml | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No pubspec.yaml found in source archive"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Flutter app: $dir"
            cd "$GITHUB_WORKSPACE/$dir"

            python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          deps = {
              "google_sign_in": "  google_sign_in: ^6.2.1",
              "geolocator": "  geolocator: ^13.0.2",
              "flutter_map": "  flutter_map: ^7.0.2",
              "latlong2": "  latlong2: ^0.9.1",
              "url_launcher": "  url_launcher: ^6.3.1",
              "firebase_core": "  firebase_core: ^3.8.1",
              "firebase_messaging": "  firebase_messaging: ^15.1.6",
              "package_info_plus": "  package_info_plus: ^8.1.2",
              "crypto": "  crypto: ^3.0.6",
              "path_provider": "  path_provider: ^2.1.5",
          }
          lines = s.splitlines()
          dep = next((i for i, line in enumerate(lines) if line.strip() == "dependencies:"), None)
          if dep is None: raise SystemExit("dependencies section missing")
          for name, entry in deps.items():
              if not any(line.strip().startswith(name + ":") for line in lines):
                  dep += 1
                  lines.insert(dep, entry)
          p.write_text("\n".join(lines) + "\n")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          lines = p.read_text().splitlines()
          lines = [line for line in lines if not line.strip().startswith("intl:")]
          dep = next((i for i, line in enumerate(lines) if line.strip() == "dependencies:"), None)
          if dep is None:
              raise SystemExit("dependencies section missing")
          lines.insert(dep + 1, "  intl: ^0.20.3")
          p.write_text("\n".join(lines) + "\n")
          PY
          flutter pub get
            if ! flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings; then
              echo "::group::Dart syntax context: app_shell.dart lines 25-33"
              nl -ba lib/features/shell/app_shell.dart | sed -n '25,33p' | fold -w 160
              echo "::endgroup::"
              exit 1
            fi
            echo "Static analysis passed. Installable APKs are produced only by the signed release workflow."
            echo "::endgroup::"
          done

      # Deliberately no APK artifact here: this workflow validates source only.\n      # Installable builds are published only by build-android-release.yml.\n
