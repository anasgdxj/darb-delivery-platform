name: Validate DARB public website
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/validate-public-web.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/validate-public-web.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline script, found {len(scripts)}")
          Path("/tmp/public.js").write_text(scripts[0])
          PY
          node --check /tmp/public.js
      - name: Validate page structure and safe download behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          required = [
              'lang="ar" dir="rtl"',
              'id="services"',
              'id="how"',
              'id="download"',
              "https://github.com/anasgdxj/darb-delivery-platform/releases/download/latest/app-release.apk",
              "تنزيل تطبيق أندرويد",
              "أحدث إصدار رسمي موقّع",
              "assets/cities/damascus.jpg",
              "assets/cities/aleppo.jpg",
              "assets/cities/homs.jpg",
              "assets/cities/hama.jpg",
              "assets/cities/latakia.jpg",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing public website requirements: " + ", ".join(missing))
          city_assets = [
              "assets/cities/damascus.jpg",
              "assets/cities/aleppo.jpg",
              "assets/cities/homs.jpg",
              "assets/cities/hama.jpg",
              "assets/cities/latakia.jpg",
          ]
          missing_files = [path for path in city_assets if not Path(path).is_file()]
          if missing_files:
              raise SystemExit("Missing city image assets: " + ", ".join(missing_files))
          if "/assets/cities/" in html:
              raise SystemExit("GitHub Pages project assets must use relative URLs")
          if "app-debug.apk" in html:
              raise SystemExit("Debug APK must never be exposed as an official download")
          if "admin/" in html or "بوابة الإدارة" in html or "دخول الإدارة" in html:
              raise SystemExit("Admin portal links must not appear on the public website")
          PY
