name: Validate and deploy DAZREVO public website

on:
  pull_request:
    paths:
      - "index.html"
      - "app/**"
      - "assets/**"
      - "en/**"
      - "tr/**"
      - "faq/**"
      - "drivers/**"
      - "merchants/**"
      - "privacy/**"
      - "terms/**"
      - "robots.txt"
      - "sitemap.xml"
      - "site.webmanifest"
      - "scripts/validate_public_website.py"
      - ".github/workflows/validate-public-web.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "assets/**"
      - "en/**"
      - "tr/**"
      - "faq/**"
      - "drivers/**"
      - "merchants/**"
      - "privacy/**"
      - "terms/**"
      - "robots.txt"
      - "sitemap.xml"
      - "site.webmanifest"
      - "scripts/validate_public_website.py"
      - ".github/workflows/validate-public-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pages, links, SEO, and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate public website
        run: python3 scripts/validate_public_website.py

  build:
    name: Package public website only
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html robots.txt sitemap.xml site.webmanifest dist/
          cp -R assets app en tr faq drivers merchants privacy terms dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/assets/css/site.css
          test -s dist/assets/js/site.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy DAZREVO website
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
