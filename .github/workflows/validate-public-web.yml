name: Validate and deploy DAZREVO public website

on:
  pull_request:
    paths:
      - "index.html"
      - "404.html"
      - "admin-web/**"
      - ".github/workflows/deploy-admin-web.yml"
      - "app-update.json"
      - "app/**"
      - "assets/**"
      - "en/**"
      - "tr/**"
      - "faq/**"
      - "drivers/**"
      - "merchants/**"
      - "privacy/**"
      - "terms/**"
      - "robots.txt"
      - "sitemap.xml"
      - "site.webmanifest"
      - "scripts/validate_public_website.py"
      - ".github/workflows/validate-public-web.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "admin-web/**"
      - ".github/workflows/deploy-admin-web.yml"
      - "app-update.json"
      - "app/**"
      - "assets/**"
      - "en/**"
      - "tr/**"
      - "faq/**"
      - "drivers/**"
      - "merchants/**"
      - "privacy/**"
      - "terms/**"
      - "robots.txt"
      - "sitemap.xml"
      - "site.webmanifest"
      - "scripts/validate_public_website.py"
      - ".github/workflows/validate-public-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pages, links, SEO, and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate public website
        run: python3 scripts/validate_public_website.py

  build:
    name: Package public website only
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html 404.html robots.txt sitemap.xml site.webmanifest app-update.json dist/
          cp -R assets app en tr faq drivers merchants privacy terms dist/
          mkdir -p dist/admin
          cp -R admin-web/. dist/admin/
          touch dist/.nojekyll
          RELEASE_APK="https://github.com/anasgdxj/darb-delivery-platform/releases/download/latest/app-release.apk"
          SITE_APK="https://anasgdxj.github.io/darb-delivery-platform/app-release.apk"
          curl --fail --silent --show-error --location --retry 3 "$RELEASE_APK" --output dist/app-release.apk
          python3 - "$PWD/dist/app-update.json" "$PWD/dist/app-release.apk" "$SITE_APK" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          apk_path = pathlib.Path(sys.argv[2])
          site_url = sys.argv[3]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(apk_path.read_bytes()).hexdigest()
          expected = str(manifest.get("sha256", "")).lower()
          if not expected or digest != expected:
              raise SystemExit(f"Published APK integrity mismatch: expected {expected}, got {digest}")
          manifest["apkUrl"] = site_url
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"Verified and staged DAZREVO {manifest['versionName']} APK ({apk_path.stat().st_size} bytes).")
          PY
          test -s dist/index.html
          test -s dist/app-update.json
          test -s dist/app-release.apk
          test -s dist/404.html
          test -s dist/admin/index.html
          test -s dist/assets/css/site.css
          test -s dist/assets/js/site.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy DAZREVO website
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
