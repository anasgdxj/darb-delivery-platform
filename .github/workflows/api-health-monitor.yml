name: DARB API Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: darb-api-health-monitor
  cancel-in-progress: true

jobs:
  health:
    name: Check API liveness and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check liveness endpoint
        env:
          API_BASE_URL: https://darb-api-yapv.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          url="${API_BASE_URL%/}/api/v1/healthz"
          code="$(curl --silent --show-error --output /tmp/darb-healthz.json --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 25 --retry 18 --retry-all-errors --retry-delay 10 "$url")"
          if [[ "$code" != "200" ]]; then
            echo "::error::DARB liveness endpoint returned HTTP $code"
            exit 1
          fi
          echo "DARB liveness endpoint is healthy (HTTP 200)."

      - name: Check readiness endpoint
        env:
          API_BASE_URL: https://darb-api-yapv.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          url="${API_BASE_URL%/}/api/v1/readyz"
          code="$(curl --silent --show-error --output /tmp/darb-readyz.json --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 25 --retry 18 --retry-all-errors --retry-delay 10 "$url")"
          if [[ "$code" != "200" ]]; then
            echo "::error::DARB readiness endpoint returned HTTP $code. Check PostgreSQL and Redis connectivity."
            exit 1
          fi
          echo "DARB readiness endpoint is healthy (HTTP 200)."
