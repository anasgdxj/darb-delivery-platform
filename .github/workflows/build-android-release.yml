# Signed Android release pipeline. Main commits marked [publish-apk] publish latest and notify registered devices.
name: Build signed DAZREVO Android release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android-release.yml"
      - "DARB-source.zip"
      - "mobile-overrides/**"
      - "darb-workspace/darb-project/mobile/**"
  pull_request:
    paths:
      - ".github/workflows/build-android-release.yml"
      - "DARB-source.zip"
      - "mobile-overrides/**"
      - "darb-workspace/darb-project/mobile/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this APK as the public latest release (leave disabled for testing)"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            DARB-source.zip
            .github/workflows/build-android-release.yml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract source and apply DARB overrides
        shell: bash
        run: |
          set -euo pipefail
          unzip -q DARB-source.zip -d extracted
          ROOT="$GITHUB_WORKSPACE"
          M="$ROOT/extracted/darb-project/mobile"
          cd "$M"
          rm -rf android
          flutter create --platforms=android --org com.darb --project-name darb --no-pub .
          rm -rf "$M/lib/screens" "$M/lib/core" "$M/lib/features" "$M/lib/design_system.dart" "$M/lib/localizations.dart" "$M/lib/notifications.dart" "$M/lib/app_update.dart"
          mkdir -p "$M/lib" "$M/test"
          cp -r "$ROOT/mobile-overrides/lib/." "$M/lib/"
          bash "$ROOT/mobile-overrides/prepare_city_assets.sh" "$M"
          cp "$ROOT/mobile-overrides/test/widget_test.dart" "$M/test/widget_test.dart"
          mkdir -p "$M/android/app/src/main/kotlin/com/darb/darb" "$M/android/app/src/main/res/xml"
          cp "$ROOT/mobile-overrides/MainActivity.kt" "$M/android/app/src/main/kotlin/com/darb/darb/MainActivity.kt"
          cp "$ROOT/mobile-overrides/DarbUpdateDownloadReceiver.kt" "$M/android/app/src/main/kotlin/com/darb/darb/DarbUpdateDownloadReceiver.kt"
          cp "$ROOT/mobile-overrides/darb_file_paths.xml" "$M/android/app/src/main/res/xml/darb_file_paths.xml"
          mkdir -p "$M/android/app/src/main/res/drawable"
          cp "$ROOT/mobile-overrides/ic_launcher.xml" "$M/android/app/src/main/res/drawable/ic_launcher.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' "$M/android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:label="darb"|android:label="دازريفو"|' "$M/android/app/src/main/AndroidManifest.xml"
          python3 - "$M/pubspec.yaml" "$M/android/app/src/main/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import re
          import sys
          pubspec, manifest = map(Path, sys.argv[1:])
          lines = pubspec.read_text().splitlines()
          deps = ["  geolocator: ^13.0.2", "  flutter_map: ^7.0.2", "  latlong2: ^0.9.1", "  url_launcher: ^6.3.1", "  firebase_core: ^3.8.1", "  firebase_messaging: ^15.1.6", "  package_info_plus: ^8.1.2", "  crypto: ^3.0.6", "  path_provider: ^2.1.5"]
          dep_index = next((i for i, line in enumerate(lines) if line.strip() == "dependencies:"), None)
          if dep_index is None: raise SystemExit("dependencies section missing")
          for dep in deps:
              name = dep.split(":")[0].strip()
              if not any(line.strip().startswith(name + ":") for line in lines):
                  dep_index += 1
                  lines.insert(dep_index, dep)
          pubspec.write_text("\n".join(lines) + "\n")
          m = manifest.read_text()
          internet = '<uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in m:
              m = m.replace("<application", internet + "\n    <application", 1)
          if "android.permission.INTERNET" not in m:
              raise SystemExit("Could not add INTERNET permission to Android manifest")
          for p in ["ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_LOCATION", "POST_NOTIFICATIONS", "REQUEST_INSTALL_PACKAGES"]:
              tag = f'<uses-permission android:name="android.permission.{p}" />'
              if tag not in m:
                  m = m.replace(internet, internet + "\n    " + tag, 1)
          m = re.sub(r'\s*<uses-permission[^>]*ACCESS_BACKGROUND_LOCATION[^>]*/>\s*', "\n    ", m)
          if 'android:usesCleartextTraffic' in m:
              m = re.sub(r'android:usesCleartextTraffic="(?:true|false)"', 'android:usesCleartextTraffic="false"', m)
          else:
              m = m.replace("<application", '<application\n        android:usesCleartextTraffic="false"', 1)
          provider = """    <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/darb_file_paths" />
              </provider>"""
          receiver = """    <receiver
                  android:name=".DarbUpdateDownloadReceiver"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.intent.action.DOWNLOAD_COMPLETE" />
                  </intent-filter>
              </receiver>"""
          if "DarbUpdateDownloadReceiver" not in m:
              m = m.replace("</application>", receiver + "\n    </application>", 1)
          if "androidx.core.content.FileProvider" not in m:
              m = m.replace("</application>", provider + "\n    </application>", 1)
          manifest.write_text(m)
          PY
          cd "$M"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.strip().startswith("intl:")]
          dep=next((i for i,line in enumerate(lines) if line.strip()=="dependencies:"),None)
          if dep is None: raise SystemExit("pubspec.yaml dependencies section missing")
          lines.insert(dep+1,"  intl: ^0.20.3")
          if not any(line.strip().startswith("google_sign_in:") for line in lines):
              lines.insert(dep+2,"  google_sign_in: ^6.2.1")
          p.write_text("\n".join(lines)+"\n")
          PY
          flutter pub get
      - name: Verify vector-only city artwork and unique translation keys
        working-directory: extracted/darb-project/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          localization = Path("lib/core/l10n/app_localizations.dart")
          source = localization.read_text(encoding="utf-8")
          source_map = source.split("static const Map<String, Map<String, String>> _values = {", 1)[0]
          keys = re.findall(r"(?m)^\s*'((?:\\.|[^'])*)'\s*:", source_map)
          duplicates = sorted({key for key in keys if keys.count(key) > 1})
          if duplicates:
              raise SystemExit("Duplicate source translation keys: " + ", ".join(duplicates))

          carousel = Path("lib/features/auth/city_carousel.dart").read_text(encoding="utf-8")
          if "DarbLoginVectorMap" not in carousel or "assets/cities/" in carousel or "Image.asset" in carousel:
              raise SystemExit("City carousel must use abstract vector artwork, not photographs.")
          if "assets/cities/" in Path("pubspec.yaml").read_text(encoding="utf-8"):
              raise SystemExit("City photo assets must not be declared in pubspec.yaml.")
          if Path("assets/cities").exists():
              raise SystemExit("City photo assets directory must not be included in the mobile build.")
          print("Vector-only city artwork and localization keys verified.")
          PY
      - name: Configure release signing and print OAuth fingerprint
        working-directory: extracted/darb-project/mobile
        env:
          DARB_KEYSTORE_BASE64: ${{ secrets.DARB_KEYSTORE_BASE64 }}
          DARB_KEYSTORE_PASSWORD: ${{ secrets.DARB_KEYSTORE_PASSWORD }}
          DARB_KEY_PASSWORD: ${{ secrets.DARB_KEY_PASSWORD }}
          DARB_KEY_ALIAS: ${{ secrets.DARB_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DARB_KEYSTORE_BASE64 DARB_KEYSTORE_PASSWORD DARB_KEY_PASSWORD DARB_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required repository secret: $name"; exit 1; fi
          done
          printf '%s' "$DARB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/darb-release.jks"
          test -s "$RUNNER_TEMP/darb-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/darb-release.jks" -storepass "$DARB_KEYSTORE_PASSWORD" -alias "$DARB_KEY_ALIAS" > "$RUNNER_TEMP/keystore-info.txt"
          SHA1="$(awk -F': ' '/SHA1:/{print $2; exit}' "$RUNNER_TEMP/keystore-info.txt")"
          if [ -z "$SHA1" ]; then echo "::error::Could not read release SHA-1"; exit 1; fi
          echo "## Google OAuth setup for this Android release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android package: com.darb.darb" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Release signing SHA-1: $SHA1" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          source = p.read_text()

          def block_bounds(value, opening):
              depth = 0
              for pos in range(opening, len(value)):
                  if value[pos] == "{":
                      depth += 1
                  elif value[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return pos
              return None

          def locate_block(value, pattern, start_at=0):
              match = re.search(pattern, value[start_at:])
              if not match:
                  return None
              match_start = start_at + match.start()
              opening = value.find("{", match_start)
              closing = block_bounds(value, opening)
              if closing is None:
                  raise SystemExit("Unbalanced Gradle block: " + pattern)
              return match_start, opening, closing

          android = locate_block(source, r'(?m)^android\s*\{')
          if not android:
              raise SystemExit("Could not locate Android configuration block")
          _, android_open, android_close = android

          # Remove a generated signingConfigs block, if one exists.
          existing = locate_block(source, r'(?m)^\s*signingConfigs\s*\{', android_open + 1)
          if existing and existing[2] < android_close:
              source = source[:existing[0]] + source[existing[2] + 1:]
              android = locate_block(source, r'(?m)^android\s*\{')
              _, android_open, android_close = android

          signing_block = """ 
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("DARB_KEYSTORE_PATH"))
                      storePassword = System.getenv("DARB_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("DARB_KEY_ALIAS")
                      keyPassword = System.getenv("DARB_KEY_PASSWORD")
                  }
              }

          """
          source = source[:android_open + 1] + "\n" + signing_block + source[android_open + 1:]

          android = locate_block(source, r'(?m)^android\s*\{')
          _, android_open, android_close = android
          build_types = locate_block(source, r'(?m)^\s*buildTypes\s*\{', android_open + 1)

          if not build_types or build_types[2] > android_close:
              source = source[:android_close] + """
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          """ + source[android_close:]
          else:
              _, build_open, build_close = build_types
              release = locate_block(source, r'(?m)^\s*(?:release|getByName\("release"\))\s*\{', build_open + 1)
              if not release or release[2] > build_close:
                  source = source[:build_close] + """
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              """ + source[build_close:]
              else:
                  _, release_open, release_close = release
                  body = source[release_open + 1:release_close]
                  body = re.sub(r'(?m)^\s*signingConfig\s*=.*(?:\n|$)', '', body)
                  body = '\n                signingConfig = signingConfigs.getByName("release")\n' + body.lstrip('\n')
                  source = source[:release_open + 1] + body + source[release_close:]

          android = locate_block(source, r'(?m)^android\s*\{')
          _, android_open, android_close = android
          android_body = source[android_open:android_close]
          if 'create("release")' not in android_body:
              raise SystemExit("Release signing configuration was not created inside android{}")
          if 'signingConfig = signingConfigs.getByName("release")' not in android_body:
              raise SystemExit("Release build type is not connected to release signing")
          p.write_text(source)
          PY
          rm -rf "$GITHUB_WORKSPACE/extracted-play"
          cp -a "$GITHUB_WORKSPACE/extracted" "$GITHUB_WORKSPACE/extracted-play"
          PLAY_M="$GITHUB_WORKSPACE/extracted-play/darb-project/mobile"
          rm -f "$PLAY_M/android/app/src/main/kotlin/com/darb/darb/DarbUpdateDownloadReceiver.kt" \
                "$PLAY_M/android/app/src/main/res/xml/darb_file_paths.xml"
          cat > "$PLAY_M/android/app/src/main/kotlin/com/darb/darb/MainActivity.kt" <<'KOTLIN'
          package com.darb.darb

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          KOTLIN
          python3 - "$PLAY_M/android/app/src/main/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import re
          import sys
          manifest = Path(sys.argv[1])
          m = manifest.read_text()
          m = re.sub(r'\s*<uses-permission[^>]*REQUEST_INSTALL_PACKAGES[^>]*/>\s*', "\n    ", m)
          m = re.sub(r'\s*<uses-permission[^>]*ACCESS_BACKGROUND_LOCATION[^>]*/>\s*', "\n    ", m)
          m = re.sub(r'\s*<receiver[^>]*DarbUpdateDownloadReceiver[\s\S]*?</receiver>\s*', "\n    ", m)
          m = re.sub(r'\s*<provider[^>]*androidx\.core\.content\.FileProvider[\s\S]*?</provider>\s*', "\n    ", m)
          assert "REQUEST_INSTALL_PACKAGES" not in m, "Play Store manifest must not contain REQUEST_INSTALL_PACKAGES"
          assert "ACCESS_BACKGROUND_LOCATION" not in m, "Play Store manifest must not contain ACCESS_BACKGROUND_LOCATION"
          assert "DarbUpdateDownloadReceiver" not in m, "Play Store manifest must not reference DarbUpdateDownloadReceiver"
          assert 'android:usesCleartextTraffic="false"' in m, "Play Store manifest must disable cleartext traffic"
          manifest.write_text(m)
          PY
      - name: Build and test signed Direct APK & Play Store AAB
        working-directory: extracted/darb-project/mobile
        env:
          DARB_KEYSTORE_PATH: ${{ runner.temp }}/darb-release.jks
          DARB_KEYSTORE_PASSWORD: ${{ secrets.DARB_KEYSTORE_PASSWORD }}
          DARB_KEY_ALIAS: ${{ secrets.DARB_KEY_ALIAS }}
          DARB_KEY_PASSWORD: ${{ secrets.DARB_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then echo "::error::Missing GOOGLE_SERVER_CLIENT_ID"; exit 1; fi
          args=(--release --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID")
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            args+=(--dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID")
            echo "::notice::Firebase configuration secrets are present; FCM will be enabled in this build."
            echo "Firebase configuration: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Firebase secrets incomplete; notifications will be disabled in this build."
            echo "Firebase configuration: incomplete (notifications disabled)" >> "$GITHUB_STEP_SUMMARY"
          fi
          flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }
          allprojects {
              tasks.configureEach { task ->
                  if (task.name == "lintVitalAnalyzeRelease" || task.name == "lintVitalRelease") {
                      task.enabled = false
                  }
              }
          }
          GRADLE
          echo "Discovered Flutter test files:"
          find test -type f -name '*_test.dart' -print
          test -s test/widget_test.dart || { echo "::error::Required test/widget_test.dart was not assembled from mobile-overrides."; exit 1; }
          flutter test --no-pub
          echo "Flutter tests: passed" >> "$GITHUB_STEP_SUMMARY"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          # The currently installed customer build is versionCode 1677.
          # Never generate a downgrade, even if the published manifest is unavailable.
          BUILD_NUMBER=$((1301 + COMMIT_COUNT))
          LATEST_MANIFEST="$RUNNER_TEMP/darb-latest-app-update.json"
          PUBLISHED_CODE=1677
          if curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/anasgdxj/darb-delivery-platform/releases/download/latest/app-update.json" \
            --output "$LATEST_MANIFEST"; then
            PUBLISHED_CODE_FROM_MANIFEST="$(python3 - "$LATEST_MANIFEST" <<'PY'
          import json, pathlib, sys
          try:
              value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).get("versionCode", 0)
              print(int(value) if str(value).isdigit() else 0)
          except Exception:
              print(0)
          PY
          )"
            if [ "$PUBLISHED_CODE_FROM_MANIFEST" -gt "$PUBLISHED_CODE" ]; then
              PUBLISHED_CODE="$PUBLISHED_CODE_FROM_MANIFEST"
            fi
          fi
          if [ "$PUBLISHED_CODE" -ge "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$((PUBLISHED_CODE + 1))
          fi
          if [ "$BUILD_NUMBER" -le "$PUBLISHED_CODE" ]; then
            echo "::error::Generated Android versionCode is not greater than the installed/published release."
            exit 1
          fi
          BUILD_NAME="1.0.$BUILD_NUMBER"
          echo "- Android versionCode: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android versionName: $BUILD_NAME" >> "$GITHUB_STEP_SUMMARY"

          build_succeeded=false
          for attempt in 1 2 3; do
            build_log="$RUNNER_TEMP/darb-android-build-$attempt.log"
            if flutter build apk "${args[@]}" --dart-define=DARB_PLAY_STORE=false --build-number "$BUILD_NUMBER" --build-name "$BUILD_NAME" 2>&1 | tee "$build_log"; then
              build_succeeded=true
              break
            fi
            if ! grep -Eiq '429|Too Many Requests|Could not GET|502|503|504|Connection reset|timed out' "$build_log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Transient Maven/Gradle download failure; retrying Android APK build (attempt $((attempt + 1))/3)."
              sleep $((attempt * 30))
            fi
          done
          if [ "$build_succeeded" != true ]; then
            echo "::error::Android direct APK build failed after three retries."
            exit 1
          fi
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          python3 - "$BUILD_NUMBER" "$BUILD_NAME" "$APK_SHA256" > build/app/outputs/flutter-apk/app-update.json <<'PY'
          import json, sys
          build, name, digest = sys.argv[1:]
          json.dump({
              "versionCode": int(build),
              "versionName": name,
              "apkUrl": "https://github.com/anasgdxj/darb-delivery-platform/releases/download/latest/app-release.apk",
              "sha256": digest,
              "releaseNotes": "\n".join([
                  "تصميم محدّث وأكثر عصرية لواجهات التطبيق",
                  "تحسين عرض الطلبات وبطاقات المندوبين",
                  "تطوير واجهات المتاجر والمنتجات ولوحة الإدارة",
                  "تحسين التنقل وتجربة الاستخدام",
                  "إصلاحات وتحسينات عامة للاستقرار"
              ])
          }, sys.stdout, ensure_ascii=False)
          PY
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-cert.txt"
          echo "Direct APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"

          # Telegram hosted Bot API accepts documents up to 50 MB. Preserve
          # the universal release APK and build a smaller ARM64 variant for Telegram.
          cp "$APK" "$RUNNER_TEMP/dazrevo-universal-app-release.apk"
          flutter build apk --split-per-abi "${args[@]}" --dart-define=DARB_PLAY_STORE=false --build-number "$BUILD_NUMBER" --build-name "$BUILD_NAME"
          TELEGRAM_APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$TELEGRAM_APK"
          "$APKSIGNER" verify --verbose "$TELEGRAM_APK"
          cp "$RUNNER_TEMP/dazrevo-universal-app-release.apk" "$APK"
          TELEGRAM_APK_SIZE="$(stat -c '%s' "$TELEGRAM_APK")"
          echo "Telegram ARM64 APK size: $TELEGRAM_APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"

          cd "$GITHUB_WORKSPACE/extracted-play/darb-project/mobile"
          aab_succeeded=false
          for attempt in 1 2 3; do
            aab_log="$RUNNER_TEMP/darb-play-aab-build-$attempt.log"
            if flutter build appbundle "${args[@]}" --dart-define=DARB_PLAY_STORE=true --build-number "$BUILD_NUMBER" --build-name "$BUILD_NAME" 2>&1 | tee "$aab_log"; then
              aab_succeeded=true
              break
            fi
            if ! grep -Eiq '429|Too Many Requests|Could not GET|502|503|504|Connection reset|timed out' "$aab_log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Transient Maven/Gradle download failure; retrying Play Store AAB build (attempt $((attempt + 1))/3)."
              sleep $((attempt * 30))
            fi
          done
          if [ "$aab_succeeded" != true ]; then
            echo "::error::Android Play Store AAB build failed after three retries."
            exit 1
          fi
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          AAB_SHA256="$(sha256sum "$AAB" | cut -d' ' -f1)"
          echo "Play Store AAB SHA-256: $AAB_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darb-android-signed-release
          path: extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: darb-android-playstore-aab
          path: extracted-play/darb-project/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      # Release publication is deliberately gated by the [publish-apk] commit marker; artifacts are uploaded first.
      - name: Publish signed APK as the latest public release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-apk]'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-release.apk"
          APK_DIR="$(dirname "$APK")"
          if gh release view latest >/dev/null 2>&1; then
            # Explicitly delete stale assets before uploading. `--clobber` uses
            # GitHub's replace path, which returned HTTP 500 for the existing
            # APK asset and prevented the release notification from running.
            gh release delete-asset latest app-release.apk --yes || true
            gh release delete-asset latest app-update.json --yes || true
            gh release upload latest "$APK#app-release.apk" "$APK_DIR/app-update.json#app-update.json"
            gh release edit latest --title "دازريفو (DAZREVO) — أحدث إصدار أندرويد" --notes "إصدار أندرويد الرسمي الموقّع من دازريفو (DAZREVO). تحقق من SHA-256 في ملخص عملية البناء."
          else
            gh release create latest "$APK#app-release.apk" "$APK_DIR/app-update.json#app-update.json" --title "دازريفو (DAZREVO) — أحدث إصدار أندرويد" --notes "إصدار أندرويد الرسمي الموقّع من دازريفو (DAZREVO)."
          fi

      - name: Notify DARB users about the published release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-apk]'))
        env:
          DARB_RELEASE_WEBHOOK_TOKEN: ${{ secrets.DARB_RELEASE_WEBHOOK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DARB_RELEASE_WEBHOOK_TOKEN:-}" ]; then
            echo "::error::DARB_RELEASE_WEBHOOK_TOKEN is required; refusing to mark a published release as fully delivered."
            echo "Release push announcement: failed (missing GitHub secret)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          MANIFEST="extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-update.json"
          jq --arg releaseTag "latest" '. + {releaseTag: $releaseTag}' "$MANIFEST" > "$RUNNER_TEMP/darb-release-notification.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          token = os.environ.get("DARB_RELEASE_WEBHOOK_TOKEN", "").strip()
          payload_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "darb-release-notification.json"
          result_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "darb-release-notification-result.json"
          payload = payload_path.read_bytes()
          url = "https://darb-api-yapv.onrender.com/api/v1/internal/release-notifications/publish"
          last_error = None

          for attempt in range(1, 5):
              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      result_path.write_bytes(response.read())
                      if response.status < 200 or response.status >= 300:
                          raise RuntimeError(f"Notification endpoint returned HTTP {response.status}")
                  break
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  last_error = RuntimeError(f"Notification endpoint returned HTTP {error.code}: {body[:1000]}")
                  if error.code not in (429, 500, 502, 503, 504) or attempt == 4:
                      raise last_error
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  last_error = error
                  if attempt == 4:
                      raise RuntimeError(f"Could not reach notification endpoint after 4 attempts: {error}") from error
              time.sleep(attempt * 5)

          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("pushSkipped") is not False or int(result.get("pushFailed", 0) or 0) != 0:
              raise SystemExit("FCM delivery was not confirmed: " + json.dumps(result, ensure_ascii=False))
          targeted = int(result.get("targetedDevices", 0) or 0)
          sent = int(result.get("pushSent", 0) or 0)
          if targeted > 0 and sent <= 0:
              raise SystemExit("FCM accepted no notifications for registered devices: " + json.dumps(result, ensure_ascii=False))
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          if targeted == 0:
              summary.open("a", encoding="utf-8").write("Release push announcement: no registered devices; no push was sent.\\n")
          else:
              summary.open("a", encoding="utf-8").write(
                  f"Release push announcement: FCM accepted {sent} notifications for {targeted} registered devices; actionable failures: 0.\\n"
              )
          print(f"Release notification confirmed: {sent}/{targeted} devices.")
          PY
          if ! jq -e '.pushSkipped == false and (.pushFailed // 0) == 0 and ((.targetedDevices // 0) == 0 or (.pushSent // 0) > 0)' "$RUNNER_TEMP/darb-release-notification-result.json" >/dev/null; then
            echo "::error::FCM delivery was not confirmed for the registered DARB devices."
            cat "$RUNNER_TEMP/darb-release-notification-result.json"
            exit 1
          fi
          TARGETED="$(jq -r '.targetedDevices // 0' "$RUNNER_TEMP/darb-release-notification-result.json")"
          SENT="$(jq -r '.pushSent // 0' "$RUNNER_TEMP/darb-release-notification-result.json")"
          FAILED="$(jq -r '.pushFailed // 0' "$RUNNER_TEMP/darb-release-notification-result.json")"
          if [ "$TARGETED" -eq 0 ]; then
            echo "Release push announcement: no registered devices; no push was sent." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release push announcement: FCM accepted $SENT notifications for $TARGETED registered devices; actionable failures: $FAILED." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send published APK to Telegram channel
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-apk]'))
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@DAZREVO"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request
          import uuid

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "@DAZREVO").strip()
          if not token:
              summary.open("a", encoding="utf-8").write(
                  "\nTelegram APK delivery: NOT SENT — add the TELEGRAM_BOT_TOKEN repository secret.\n"
              )
              print("::warning::Telegram APK delivery skipped because TELEGRAM_BOT_TOKEN is not configured.")
              raise SystemExit(0)

          apk_path = pathlib.Path("extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk")
          manifest_path = pathlib.Path("extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-update.json")
          if not apk_path.is_file() or apk_path.stat().st_size == 0:
              raise SystemExit("The signed ARM64 APK file is missing or empty; refusing to send an invalid Telegram document.")
          if apk_path.stat().st_size > 50 * 1024 * 1024:
              summary.open("a", encoding="utf-8").write(
                  "\nTelegram APK delivery: NOT SENT — ARM64 APK exceeds Telegram's 50 MB Bot API upload limit; universal APK remains available in GitHub Releases.\n"
              )
              print("::warning::ARM64 APK exceeds Telegram's 50 MB upload limit; use the GitHub release download.")
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          version = html.escape(str(manifest.get("versionName", "New version")))
          build = html.escape(str(manifest.get("versionCode", "")))
          notes = str(manifest.get("releaseNotes", "")).strip()
          notes_html = html.escape(notes[:450]) if notes else "تحسينات وإصلاحات عامة"
          caption = (
              "🚀 <b>صدر تحديث جديد لتطبيق DAZREVO</b>\n\n"
              f"📦 الإصدار: <b>{version}</b>\n"
              f"🔢 رقم البناء: <code>{build}</code>\n\n"
              f"📝 <b>أبرز التحديثات</b>\n{notes_html}\n\n"
              "📎 ملف APK الرسمي مرفق — حمّله وثبّته لتحديث التطبيق."
          )
          boundary = "----DAZREVO" + uuid.uuid4().hex
          fields = [
              ("chat_id", chat_id.encode("utf-8")),
              ("parse_mode", b"HTML"),
              ("caption", caption.encode("utf-8")),
          ]
          body = bytearray()
          for name, value in fields:
              body.extend(f"--{boundary}\r\n".encode())
              body.extend(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode())
              body.extend(value)
              body.extend(b"\r\n")
          body.extend(f"--{boundary}\r\n".encode())
          body.extend(
              b'Content-Disposition: form-data; name="document"; filename="app-release.apk"\r\n'
          )
          body.extend(b"Content-Type: application/vnd.android.package-archive\r\n\r\n")
          body.extend(apk_path.read_bytes())
          body.extend(b"\r\n")
          body.extend(f"--{boundary}--\r\n".encode())

          endpoint = "https://api.telegram.org/bot" + token + "/sendDocument"
          last_error = None
          for attempt in range(1, 4):
              request = urllib.request.Request(
                  endpoint,
                  data=bytes(body),
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  if not result.get("ok"):
                      raise RuntimeError("Telegram API rejected the APK document")
                  message_id = result.get("result", {}).get("message_id", "unknown")
                  sent_size = result.get("result", {}).get("document", {}).get("file_size", apk_path.stat().st_size)
                  summary.open("a", encoding="utf-8").write(
                      f"\nTelegram APK delivery: SENT app-release.apk ({sent_size} bytes) to {chat_id}; message ID {message_id}.\n"
                  )
                  print(f"Telegram accepted the APK document for {chat_id}; message ID {message_id}.")
                  break
              except urllib.error.HTTPError as error:
                  response_body = error.read().decode("utf-8", "replace")[:500]
                  last_error = RuntimeError(f"Telegram API HTTP {error.code}: {response_body}")
                  if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                      break
              except (urllib.error.URLError, TimeoutError, OSError, ValueError, RuntimeError) as error:
                  last_error = error
                  if attempt == 3:
                      break
              time.sleep(attempt * 3)
          if last_error is not None:
              summary.open("a", encoding="utf-8").write(
                  "\nTelegram APK delivery: FAILED — APK remains available in the GitHub latest release.\n"
              )
              print(f"::warning::Telegram APK delivery failed; APK remains published: {last_error}")
              raise SystemExit(0)
          PY
