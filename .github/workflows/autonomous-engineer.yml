name: DAZREVO Autonomous Engineer
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Engineering task for the agent"
        required: true
        type: string
  issues:
    types: [labeled]
  pull_request:
    paths:
      - ".github/workflows/autonomous-engineer.yml"
      - "automation/agent/**"
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: autonomous-engineer-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validate-agent:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate agent Python syntax and patch hygiene
        run: |
          set -euo pipefail
          python3 -m py_compile automation/agent/run.py
          git diff --check
  engineer:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.label.name == 'autonomous-task')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base proposals on current main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate a constrained patch
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_INPUT: ${{ inputs.task }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 automation/agent/run.py
          if [ -f "$RUNNER_TEMP/agent-no-change" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/agent-no-change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/agent-summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Run repository-safe validation
        if: steps.agent.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --check
          python3 -m compileall -q automation/agent
      - name: Create branch and pull request
        if: steps.agent.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_NUMBER: ${{ github.event.issue.number }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="ai/engineer-${GH_RUN_ID}"
          git config user.name "dazrevo-autonomous-engineer[bot]"
          git config user.email "dazrevo-autonomous-engineer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A -- mobile-overrides backend-overrides
          if git diff --cached --quiet; then
            echo "::error::No build-consumed source changes were staged."
            exit 1
          fi
          git commit -m "feat(agent): implement queued engineering task"
          git push origin "$BRANCH"
          TITLE="AI engineering proposal #${GH_RUN_ID}"
          BODY="Automated proposal generated by the constrained DAZREVO Gemini engineer.\n\nTask source: ${GH_EVENT_NAME}.\n\nThis PR is not auto-merged. Review the diff and required CI checks before merging."
          gh pr create --repo "$GH_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
