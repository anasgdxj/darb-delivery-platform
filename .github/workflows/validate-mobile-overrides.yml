name: Validate DARB mobile overrides

on:
  pull_request:
    paths:
      - "mobile-overrides/**"
      - "darb-workspace/darb-project/mobile/**"
      - "DARB-source.zip"
      - ".github/workflows/validate-mobile-overrides.yml"
      - ".github/workflows/build-android-release.yml"
  push:
    branches: [main]
    paths:
      - "mobile-overrides/**"
      - "darb-workspace/darb-project/mobile/**"
      - "DARB-source.zip"
      - ".github/workflows/validate-mobile-overrides.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Assemble the exact mobile source used by release
        shell: bash
        run: |
          set -euo pipefail
          unzip -q DARB-source.zip -d extracted
          M="$GITHUB_WORKSPACE/extracted/darb-project/mobile"
          cd "$M"
          rm -rf android
          flutter create --platforms=android --org com.darb --project-name darb --no-pub .
          cd "$GITHUB_WORKSPACE"
          rm -rf "$M/lib/screens" "$M/lib/core" "$M/lib/features" "$M/lib/design_system.dart" "$M/lib/localizations.dart" "$M/lib/notifications.dart" "$M/lib/app_update.dart"
          mkdir -p "$M/lib" "$M/test"
          cp -r mobile-overrides/lib/. "$M/lib/"
          bash mobile-overrides/prepare_city_assets.sh "$M"
          mkdir -p "$M/android/app/src/main/kotlin/com/darb/darb" "$M/android/app/src/main/res/xml"
          cp mobile-overrides/MainActivity.kt "$M/android/app/src/main/kotlin/com/darb/darb/MainActivity.kt"
          cp mobile-overrides/DarbUpdateDownloadReceiver.kt "$M/android/app/src/main/kotlin/com/darb/darb/DarbUpdateDownloadReceiver.kt"
          cp mobile-overrides/darb_file_paths.xml "$M/android/app/src/main/res/xml/darb_file_paths.xml"
          cp mobile-overrides/test/widget_test.dart "$M/test/widget_test.dart"
          mkdir -p "$M/android/app/src/main/res/drawable"
          cp mobile-overrides/ic_launcher.xml "$M/android/app/src/main/res/drawable/ic_launcher.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' "$M/android/app/src/main/AndroidManifest.xml"
          python3 - "$M/android/app/src/main/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); m=p.read_text()
          permission='<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          notification_permission='<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if notification_permission not in m:
              m=m.replace(permission, permission+"\n    "+notification_permission, 1)
          if permission not in m:
              m=m.replace("<application", permission+"\n    <application", 1)
          if notification_permission not in m:
              m=m.replace(permission, permission+"\n    "+notification_permission, 1)
          provider="""    <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/darb_file_paths" />
              </provider>"""
          receiver="""    <receiver
                  android:name=".DarbUpdateDownloadReceiver"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.intent.action.DOWNLOAD_COMPLETE" />
                  </intent-filter>
              </receiver>"""
          if "DarbUpdateDownloadReceiver" not in m:
              m=m.replace("</application>", receiver+"\n    </application>", 1)
          if "androidx.core.content.FileProvider" not in m:
              m=m.replace("</application>", provider+"\n    </application>", 1)
          p.write_text(m)
          PY
          cd "$M"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.strip().startswith("intl:")]
          dep=next((i for i,line in enumerate(lines) if line.strip()=="dependencies:"),None)
          if dep is None: raise SystemExit("pubspec.yaml dependencies section missing")
          for name, version in [("intl","^0.20.3"),("google_sign_in","^6.2.1"),("geolocator","^13.0.2"),("flutter_map","^7.0.2"),("latlong2","^0.9.1"),("url_launcher","^6.3.1"),("firebase_core","^3.8.1"),("firebase_messaging","^15.1.6"),("package_info_plus","^8.1.2"),("crypto","^3.0.6"),("path_provider","^2.1.5")]:
              if not any(line.strip().startswith(name + ":") for line in lines):
                  dep += 1
                  lines.insert(dep, f"  {name}: {version}")
          p.write_text("\n".join(lines)+"\n")
          PY
          flutter pub get
      - name: Give the theme test build an isolated Android package ID
        working-directory: extracted/darb-project/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          source = gradle.read_text()
          if "applicationIdSuffix" in source:
              raise SystemExit("Refusing to add a duplicate applicationIdSuffix")
          match = re.search(r"(?m)^(\s*)buildTypes\s*\{", source)
          if not match:
              raise SystemExit("Could not locate buildTypes block safely")
          indent = match.group(1) + "    "
          if gradle.suffix == ".kts":
              block = indent + 'getByName("debug") {\n' + indent + '    applicationIdSuffix = ".themetest"\n' + indent + '}\n'
          else:
              block = indent + 'debug {\n' + indent + '    applicationIdSuffix ".themetest"\n' + indent + '}\n'
          insert_at = match.end()
          source = source[:insert_at] + "\n" + block + source[insert_at:]
          gradle.write_text(source)
          print(f"Configured isolated test package in {gradle}")
          PY
      - name: Analyze all mobile Dart sources
        working-directory: extracted/darb-project/mobile
        run: flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build Android debug APK
        working-directory: extracted/darb-project/mobile
        run: flutter build apk --debug --no-pub --build-number 32
      - name: Run Flutter tests
        working-directory: extracted/darb-project/mobile
        shell: bash
        run: |
          set -euo pipefail
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub
          else
            echo "::notice::No Flutter test files supplied by the source archive."
          fi

      - name: Upload Android debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: darb-theme-test-apk
          path: extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
